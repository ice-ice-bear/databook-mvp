name: databook-mvp
services:
  worker:
    build: .
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-databook_mvp_test}
      DB_USER: ${DB_USER:-databook_mvp}
      DB_PASSWORD: ${DB_PASSWORD:-local-demo-only}
      DATA_PROVIDER: ${DATA_PROVIDER:-mock}
      DATA_API_URL: ${DATA_API_URL:-http://example-api:8000/daily}
      ADOBE_CLIENT_ID: ${ADOBE_CLIENT_ID:-}
      ADOBE_CLIENT_SECRET: ${ADOBE_CLIENT_SECRET:-}
      ADOBE_SCOPES: ${ADOBE_SCOPES:-}
      ADOBE_GLOBAL_COMPANY_ID: ${ADOBE_GLOBAL_COMPANY_ID:-}
      ADOBE_REPORT_SUITE_ID: ${ADOBE_REPORT_SUITE_ID:-}
      ADOBE_REPORT_SUITE_TIMEZONE: ${ADOBE_REPORT_SUITE_TIMEZONE:-}
      ADOBE_CHANNEL_DIMENSION: ${ADOBE_CHANNEL_DIMENSION:-variables/marketingchannel}
      ADOBE_DEVICE_DIMENSION: ${ADOBE_DEVICE_DIMENSION:-variables/mobiledevicetype}
      ADOBE_METRIC_VISITS: ${ADOBE_METRIC_VISITS:-metrics/visits}
      ADOBE_METRIC_PAGE_VIEWS: ${ADOBE_METRIC_PAGE_VIEWS:-metrics/pageviews}
      ADOBE_METRIC_ORDERS: ${ADOBE_METRIC_ORDERS:-metrics/orders}
      ADOBE_METRIC_REVENUE_KRW: ${ADOBE_METRIC_REVENUE_KRW:-metrics/revenue}
      ADOBE_SEGMENT_ID: ${ADOBE_SEGMENT_ID:-}
      ADOBE_CHANNEL_MAP: ${ADOBE_CHANNEL_MAP:-}
      ADOBE_DEVICE_MAP: ${ADOBE_DEVICE_MAP:-}
      ADOBE_MAPPING_CONFIRMED: ${ADOBE_MAPPING_CONFIRMED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      REPORT_DIR: /app/reports
      LOG_DIR: /app/logs
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./work:/app/work:ro
    extra_hosts:
      - host.docker.internal:host-gateway
