services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: databook_mvp_demo
      MARIADB_USER: databook_mvp
      MARIADB_PASSWORD: local-demo-only
      MARIADB_ROOT_PASSWORD: local-demo-root-only
    volumes:
      - demo-db:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      timeout: 5s
      retries: 30
  example-api:
    build: .
    entrypoint: [python, example_api.py]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/daily?dates=2026-09-20,2026-09-27')"]
      interval: 3s
      timeout: 5s
      retries: 20
  worker:
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: databook_mvp_demo
      DB_USER: databook_mvp
      DB_PASSWORD: local-demo-only
    depends_on:
      example-api:
        condition: service_healthy
      db:
        condition: service_healthy
volumes:
  demo-db:
